button { pointer-events:auto; font:inherit; font-size:14px; font-weight:500; padding:8px 16px; border-radius:999px;

/* ---------- layout ---------- */
const P = i => {
  if (i === 0) return new THREE.Vector3(0, 0, 0);
  const k = i - 1, a = (k / 10) * Math.PI * 2;
  return new THREE.Vector3(Math.cos(a) * 8, Math.sin(k * 1.7) * 1.2 + 1.5, Math.sin(a) * 8);
};

/* ---------- build islands ---------- */
const islands = ISLANDS.map((d, i) => {
  const g = base(PAL[i]);
  PROPS[i](g);
  const pos = P(i);
  g.position.copy(pos);
  g.userData.idx = i;
  scene.add(g);
  const el = document.createElement('div');
  el.className = 'label';
  el.textContent = d.t;
  labelsEl.appendChild(el);
  return { ...d, i, g, pos, el, base: pos.y };
});

const goal = { ...cur };
let flying = false, active = null;

function flyTo(i) {
  active = i;
  if (i === null) {
    Object.assign(goal, { tx: 0, ty: 0, tz: 0, th: 0, ph: Math.acos(8 / 21.5), r: homeR() });
    footEl.innerHTML = '<p>拖曳旋轉・滾輪或雙指縮放・點擊島嶼前往探索</p>';
    homeBtn.disabled = true;
  } else {
    const isl = islands[i], p = isl.pos;
    let ox = p.x, oz = p.z;
    if (Math.hypot(ox, oz) < 0.1) { ox = 0; oz = 1; }
    Object.assign(goal, { tx: p.x, ty: p.y + 0.8, tz: p.z, th: Math.atan2(ox, oz), ph: 1.25, r: 9 });
    showCard(i);
    homeBtn.disabled = false;
  }
  flying = true;
  islands.forEach(x => x.el.classList.toggle('on', x.i === i));

  ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(islands.map(i => i.g), true)[0];
  if (!hit) return null;
  let o = hit.object;
  while (o && o.userData.idx === undefined) o = o.parent;
  return o ? o.userData.idx : null;
}

host.addEventListener('pointerdown', e => {
  host.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  flying = false;
  if (ptrs.size === 1) { downAt = { x: e.clientX, y: e.clientY }; moved = false; host.classList.add('drag'); }
  if (ptrs.size === 2) { moved = true; pinchD = pinchDist(); }
});
host.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) {
    host.classList.toggle('hot', pick(e.clientX, e.clientY) !== null);
    return;
  }
  const prev = ptrs.get(e.pointerId);
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) {
    if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) moved = true;
    if (moved) { cur.th -= dx * 0.006; cur.ph = clamp(cur.ph - dy * 0.006, 0.2, 1.5); }
  } else if (ptrs.size === 2) {
    const d = pinchDist();
    cur.r = clamp(cur.r * (pinchD / d), 6, 40);
    pinchD = d;
  }
});
const release = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size === 0) {
    host.classList.remove('drag');
    if (e.type === 'pointerup' && !moved && downAt) {
      const i = pick(e.clientX, e.clientY);
      if (i !== null) flyTo(i);
    }
    downAt = null;
  }
};
host.addEventListener('pointerup', release);
host.addEventListener('pointercancel', release);
host.addEventListener('wheel', e => {
  e.preventDefault();
  flying = false;
  cur.r = clamp(cur.r * Math.exp(e.deltaY * 0.001), 6, 40);
}, { passive: false });
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (active === null && !flying) goal.r = cur.r = homeR();
});
renderer.setSize(innerWidth, innerHeight);
camera.aspect = innerWidth / innerHeight;
camera.updateProjectionMatrix();

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const v = new THREE.Vector3();
const lerpAng = (a, b, t) => a + ((((b - a) % (2 * Math.PI)) + 3 * Math.PI) % (2 * Math.PI) - Math.PI) * t;

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (flying) {
    const a = 1 - Math.exp(-dt * 3);
    cur.tx += (goal.tx - cur.tx) * a;
    cur.ty += (goal.ty - cur.ty) * a;
    cur.tz += (goal.tz - cur.tz) * a;
    cur.ph += (goal.ph - cur.ph) * a;
    cur.r += (goal.r - cur.r) * a;
    cur.th = lerpAng(cur.th, goal.th, a);
    const err = Math.abs(goal.tx - cur.tx) + Math.abs(goal.ty - cur.ty) + Math.abs(goal.tz - cur.tz) + Math.abs(goal.r - cur.r);
    if (err < 0.01) flying = false;
  }
  camera.position.set(
    cur.tx + cur.r * Math.sin(cur.ph) * Math.sin(cur.th),
    cur.ty + cur.r * Math.cos(cur.ph),
    cur.tz + cur.r * Math.sin(cur.ph) * Math.cos(cur.th));
  camera.lookAt(cur.tx, cur.ty, cur.tz);
  islands.forEach(isl => { isl.g.position.y = isl.base + Math.sin(t * 0.8 + isl.i) * 0.12; });
  renderer.render(scene, camera);
  islands.forEach(isl => {
    v.copy(isl.pos); v.y += 2.6; v.project(camera);
    const x = (v.x * 0.5 + 0.5) * innerWidth, y = (-v.y * 0.5 + 0.5) * innerHeight;
    isl.el.style.display = v.z < 1 ? 'block' : 'none';
    isl.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
  });
  requestAnimationFrame(frame);
}
frame();
</script>
